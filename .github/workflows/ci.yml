name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_NO_CONFIG: "1"
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Verify public lock sources
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text())
          bad = []
          for package in lock["package"]:
              name = package["name"]
              registry = package.get("source", {}).get("registry")
              if registry and registry != "https://pypi.org/simple":
                  bad.append(f"{name}: registry {registry}")
              artifacts = []
              if "sdist" in package:
                  artifacts.append(package["sdist"])
              artifacts.extend(package.get("wheels", []))
              for artifact in artifacts:
                  url = artifact.get("url", "")
                  if url and not url.startswith("https://files.pythonhosted.org/"):
                      bad.append(f"{name}: artifact {url}")
          if bad:
              raise SystemExit("Non-public lock sources:\n" + "\n".join(bad))
          PY

      - name: Check lock
        run: uv lock --check

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Build package
        run: uv build
