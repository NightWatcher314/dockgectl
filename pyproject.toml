[project]
name = "dockgectl"
version = "0.2.2"
description = "CLI for Dockge Socket.IO automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "platformdirs>=4.3.0",
    "python-socketio[client]>=5.11.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
dockgectl = "dockgectl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
